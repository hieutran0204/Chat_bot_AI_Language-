# name: docker-compose.yml
# description: Docker Compose for local development — PostgreSQL with pgvector extension

version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: language_ai_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-language_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-language_ai_pass}
      POSTGRES_DB: ${POSTGRES_DB:-language_ai_db}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-language_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: language_ai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Backend API (uncomment when ready to containerize)
  # api:
  #   build: .
  #   container_name: language_ai_api
  #   env_file: .env
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   volumes:
  #     - ./uploads:/app/uploads

volumes:
  postgres_data:
  redis_data:
